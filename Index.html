<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RAVEN JOIN — CS2 Clan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at 50% 0%, #3b0000 0%, #090909 45%, #050505 100%);
      color: white;
      min-height: 100vh;
    }

    header {
      padding: 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #3b1111;
      background: rgba(0,0,0,.65);
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      color: #ff3030;
    }

    nav a {
      color: #aaa;
      text-decoration: none;
      margin-left: 18px;
      font-size: 13px;
    }

    nav a:hover {
      color: #ff3030;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 30px 20px;
    }

    .tag {
      color: #ff3333;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(48px, 15vw, 100px);
      line-height: .9;
      font-weight: 1000;
      letter-spacing: -4px;
      text-shadow: 0 0 35px rgba(255,0,0,.25);
    }

    h1 span {
      color: #ff2929;
    }

    .hero p {
      max-width: 550px;
      margin: 25px auto;
      color: #aaa;
      line-height: 1.7;
      font-size: 16px;
    }

    .button {
      display: inline-block;
      padding: 16px 28px;
      background: #e62424;
      color: white;
      text-decoration: none;
      font-weight: 900;
      letter-spacing: 1px;
      border-radius: 5px;
      box-shadow: 0 0 25px rgba(230,36,36,.25);
      transition: .2s;
    }

    .button:hover {
      background: #ff3d3d;
      transform: translateY(-2px);
      box-shadow: 0 0 35px rgba(230,36,36,.4);
    }

    section {
      padding: 70px 20px;
      max-width: 1000px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 32px;
    }

    .section-title p {
      color: #777;
      margin-top: 10px;
    }

    .form {
      max-width: 600px;
      margin: auto;
      background: #0d0d0d;
      border: 1px solid #2b1616;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 15px 50px rgba(0,0,0,.4);
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #ddd;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      background: #151515;
      border: 1px solid #292929;
      color: white;
      border-radius: 5px;
      outline: none;
      font-size: 15px;
    }

    input:focus,
    textarea:focus {
      border-color: #e62424;
      box-shadow: 0 0 10px rgba(230,36,36,.15);
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .submit {
      width: 100%;
      border: none;
      margin-top: 22px;
      cursor: pointer;
      font-size: 14px;
    }

    .clips {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }
