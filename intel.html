<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RAVEN | CS2 Clan</title>
<body>

<h1 style="color:red;font-size:80px;text-align:center;">
RAVEN TEST 123
</h1>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #050505;
    color: white;
}

/* ================= HEADER ================= */

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 75px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    background: rgba(5,5,5,0.92);
    border-bottom: 1px solid #222;

    backdrop-filter: blur(10px);

    z-index: 999;
}

.logo {
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 4px;
    color: #ff2020;
}

nav {
    display: flex;
    gap: 30px;
}

nav a {
    color: #aaa;
    text-decoration: none;
    font-weight: bold;
    transition: 0.2s;
}

nav a:hover {
    color: #ff2020;
}

/* ================= HERO ================= */

.hero {
    min-height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 100px 20px 50px;

    background:
        radial-gradient(
            circle at center,
            rgba(180,0,0,0.35),
            transparent 45%
        ),
        #050505;
}

.hero h1 {
    font-size: clamp(80px, 15vw, 180px);
    font-weight: 1000;
    letter-spacing: 15px;

    text-shadow:
        0 0 30px rgba(255,0,0,0.4);
}

.hero h1 span {
    color: #ff2020;
}

.hero p {
    margin-top: 10px;

    color: #888;

    font-size: 18px;
    letter-spacing: 6px;
}

.hero-buttons {
    margin-top: 35px;

    display: flex;
    gap: 15px;
}

.button {
    padding: 15px 30px;

    border: none;
    border-radius: 6px;

    background: #e71919;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;

    text-decoration: none;

    transition: 0.2s;
}

.button:hover {
    background: #ff3030;
    transform: translateY(-2px);
}

.button.secondary {
    background: transparent;
    border: 1px solid #333;
}

.button.secondary:hover {
    border-color: #ff2020;
}

/* ================= SECTIONS ================= */

section {
    padding: 100px 7%;
}

.section-title {
    text-align: center;

    font-size: 42px;

    margin-bottom: 55px;
}

.section-title span {
    color: #ff2020;
}

/* ================= MEMBERS ================= */

.members {
    max-width: 1000px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));

    gap: 20px;
}

.member {
    padding: 35px 25px;

    text-align: center;

    background: #0d0d0d;

    border: 1px solid #242424;

    border-radius: 12px;

    transition: 0.25s;
}

.member:hover {
    transform: translateY(-6px);

    border-color: #ff2020;

    box-shadow:
        0 0 30px rgba(255,0,0,0.12);
}

.avatar {
    width: 80px;
    height: 80px;

    margin: auto;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #171717;

    border: 2px solid #ff2020;

    color: #ff2020;

    font-size: 28px;
    font-weight: 900;
}

.member h3 {
    margin-top: 18px;

    font-size: 21px;
}

.role {
    margin-top: 7px;

    color: #ff2020;

    font-size: 12px;

    font-weight: bold;

    letter-spacing: 2px;
}

/* ================= JOIN ================= */

.join-section {
    background: #090909;
}

.form {
    max-width: 650px;

    margin: auto;

    padding: 35px;

    background: #101010;

    border: 1px solid #292929;

    border-radius: 14px;
}

.form-group {
    margin-bottom: 20px;
}

.form-group label {
    display: block;

    margin-bottom: 8px;

    color: #bbb;

    font-size: 14px;

    font-weight: bold;
}

.form-group input,
.form-group textarea {
    width: 100%;

    padding: 14px;

    background: #070707;

    color: white;

    border: 1px solid #303030;

    border-radius: 7px;

    outline: none;

    font-size: 15px;
}

.form-group input:focus,
.form-group textarea:focus {
    border-color: #ff2020;
}

.form-group textarea {
    height: 120px;

    resize: vertical;
}

.submit-button {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 7px;

    background: #e71919;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    transition: 0.2s;
}

.submit-button:hover {
    background: #ff3030;
}

/* ================= SUCCESS ================= */

.success {
    display: none;

    margin-top: 20px;

    padding: 15px;

    background: #0c351d;

    border: 1px solid #1c8a45;

    border-radius: 7px;

    color: #65e695;

    text-align: center;
}

/* ================= STAFF ================= */

.staff {
    background: #050505;
}

.staff-login {
    max-width: 400px;

    margin: auto;

    padding: 30px;

    background: #101010;

    border: 1px solid #292929;

    border-radius: 12px;
}

.staff-login h3 {
    margin-bottom: 20px;

    text-align: center;
}

.staff-login input {
    width: 100%;

    padding: 14px;

    margin-bottom: 12px;

    background: #070707;

    color: white;

    border: 1px solid #333;

    border-radius: 7px;

    outline: none;
}

.staff-panel {
    display: none;

    max-width: 900px;

    margin: auto;
}

.application {
    margin-bottom: 15px;

    padding: 25px;

    background: #101010;

    border: 1px solid #292929;

    border-radius: 10px;
}

.application h3 {
    color: #ff2020;

    margin-bottom: 10px;
}

.application p {
    color: #aaa;

    margin: 6px 0;
}

.clip-link {
    color: #ff3030;

    text-decoration: none;
}

.clip-link:hover {
    text-decoration: underline;
}

.application-buttons {
    margin-top: 18px;
}

.accept,
.reject {
    padding: 10px 20px;

    border: none;

    border-radius: 6px;

    color: white;

    font-weight: bold;

    cursor: pointer;

    margin-right: 8px;
}

.accept {
    background: #159447;
}

.reject {
    background: #c92323;
}

.accept:hover {
    background: #1db956;
}

.reject:hover {
    background: #ed3030;
}

.no-applications {
    text-align: center;

    color: #666;

    padding: 30px;
}

/* ================= FOOTER ================= */

footer {
    padding: 30px;

    text-align: center;

    color: #555;

    border-top: 1px solid #202020;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    header {
        padding: 0 20px;
    }

    nav {
        display: none;
    }

    .hero h1 {
        letter-spacing: 5px;
    }

    .hero-buttons {
        flex-direction: column;
        width: 100%;
        max-width: 300px;
    }

    .button {
        text-align: center;
    }

    section {
        padding: 75px 20px;
    }

    .form {
        padding: 22px;
    }
}
</style>
</head>


<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">
        RAVEN
    </div>

    <nav>
        <a href="#home">HOME</a>
        <a href="#members">MEMBERS</a>
        <a href="#join">JOIN</a>
        <a href="#staff">STAFF</a>
    </nav>

</header>


<!-- ================= HERO ================= -->

<section class="hero" id="home">

    <h1>
        RA<span>V</span>EN
    </h1>

    <p>
        CS2 COMPETITIVE CLAN
    </p>

    <div class="hero-buttons">

        <a
            class="button"
            href="#join">
            JOIN RAVEN
        </a>

        <a
            class="button secondary"
            href="#members">
            MEMBERS
        </a>

    </div>

</section>


<!-- ================= MEMBERS ================= -->

<section id="members">

    <h2 class="section-title">
        OUR <span>MEMBERS</span>
    </h2>

    <div class="members">

        <div class="member">

            <div class="avatar">
                M
            </div>

            <h3>
                MONARCK
            </h3>

            <div class="role">
                OWNER
            </div>

        </div>


        <div class="member">

            <div class="avatar">
                R
            </div>

            <h3>
                RENOX
            </h3>

            <div class="role">
                MEMBER
            </div>

        </div>


        <div class="member">

            <div class="avatar">
                K
            </div>

            <h3>
                KASPIKK
            </h3>

            <div class="role">
                MEMBER
            </div>

        </div>

    </div>

</section>


<!-- ================= JOIN ================= -->

<section
    class="join-section"
    id="join">

    <h2 class="section-title">
        JOIN <span>RAVEN</span>
    </h2>


    <form
        class="form"
        id="applicationForm">


        <div class="form-group">

            <label>
                CS2 NICK
            </label>

            <input
                id="nickname"
                type="text"
                placeholder="Your CS2 nickname"
                required>

        </div>


        <div class="form-group">

            <label>
                DISCORD
            </label>

            <input
                id="discord"
                type="text"
                placeholder="Your Discord username"
                required>

        </div>


        <div class="form-group">

            <label>
                CS2 CLIP
            </label>

            <input
                id="clip"
                type="url"
                placeholder="https://youtube.com/..."
                required>

        </div>


        <div class="form-group">

            <label>
                ABOUT YOU
            </label>

            <textarea
                id="message"
                placeholder="Tell us about yourself..."></textarea>

        </div>


        <button
            class="submit-button"
            type="submit">

            SEND APPLICATION

        </button>


        <div
            class="success"
            id="success">

            APPLICATION SENT!
            <br>
            RAVEN staff will review your application.

        </div>

    </form>

</section>


<!-- ================= STAFF ================= -->

<section
    class="staff"
    id="staff">

    <h2 class="section-title">
        <span>STAFF</span> PANEL
    </h2>


    <div
        class="staff-login"
        id="staffLogin">

        <h3>
            MODERATOR LOGIN
        </h3>

        <input
            id="staffPassword"
            type="password"
            placeholder="Moderator password">

        <button
            class="submit-button"
            onclick="loginStaff()">

            LOGIN

        </button>

    </div>


    <div
        class="staff-panel"
        id="staffPanel">

        <div id="applications"></div>

    </div>

</section>


<!-- ================= FOOTER ================= -->

<footer>

    © 2026 RAVEN CS2 CLAN

</footer>


<script>

/*
====================================================
RAVEN APPLICATION SYSTEM
====================================================

IMPORTANT:

This version stores applications in the browser.

It is NOT yet connected to GitHub.

The moderator password below is only a demo
and should NOT be used for a real production website.

====================================================
*/


const MODERATOR_PASSWORD = "RAVEN2026";


let applications =
    JSON.parse(
        localStorage.getItem("ravenApplications")
    ) || [];


/* ================= APPLY ================= */

document
.getElementById("applicationForm")
.addEventListener("submit", function(event) {

    event.preventDefault();


    const nickname =
        document
        .getElementById("nickname")
        .value
        .trim();


    const discord =
        document
        .getElementById("discord")
        .value
        .trim();


    const clip =
        document
        .getElementById("clip")
        .value
        .trim();


    const message =
        document
        .getElementById("message")
        .value
        .trim();


    const application = {

        id: Date.now(),

        nickname: nickname,

        discord: discord,

        clip: clip,

        message: message,

        status: "pending"

    };


    applications.push(application);


    saveApplications();


    document
    .getElementById("success")
    .style.display = "block";


    document
    .getElementById("applicationForm")
    .reset();


    setTimeout(function() {

        document
        .getElementById("success")
        .style.display = "none";

    }, 5000);

});


/* ================= SAVE ================= */

function saveApplications() {

    localStorage.setItem(
        "ravenApplications",
        JSON.stringify(applications)
    );

}


/* ================= STAFF LOGIN ================= */

function loginStaff() {

    const password =
        document
        .getElementById("staffPassword")
        .value;


    if(password === MODERATOR_PASSWORD) {

        document
        .getElementById("staffLogin")
        .style.display = "none";


        document
        .getElementById("staffPanel")
        .style.display = "block";


        loadApplications();

    }

    else {

        alert("WRONG PASSWORD");

    }

}


/* ================= LOAD APPLICATIONS ================= */

function loadApplications() {

    const container =
        document
        .getElementById("applications");


    container.innerHTML = "";


    const pending =
        applications.filter(
            app => app.status === "pending"
        );


    if(pending.length === 0) {

        container.innerHTML = `
            <div class="no-applications">
                NO PENDING APPLICATIONS
            </div>
        `;

        return;

    }


    pending.forEach(function(app) {

        const element =
            document.createElement("div");


        element.className =
            "application";


        element.innerHTML = `

            <h3>
                ${escapeHTML(app.nickname)}
            </h3>

            <p>
                <strong>Discord:</strong>
                ${escapeHTML(app.discord)}
            </p>

            <p>
                <strong>Clip:</strong>
                <a
                    class="clip-link"
                    href="${escapeHTML(app.clip)}"
                    target="_blank">
                    WATCH CLIP
                </a>
            </p>

            <p>
                <strong>About:</strong>
                ${escapeHTML(app.message)}
            </p>

            <div class="application-buttons">

                <button
                    class="accept"
                    onclick="acceptApplication(${app.id})">

                    ACCEPT

                </button>

                <button
                    class="reject"
                    onclick="rejectApplication(${app.id})">

                    REJECT

                </button>

            </div>
        `;


        container.appendChild(element);

    });

}


/* ================= ACCEPT ================= */

function acceptApplication(id) {

    const application =
        applications.find(
            app => app.id === id
        );


    if(!application) return;


    application.status =
        "accepted";


    saveApplications();


    loadApplications();


    alert(
        application.nickname +
        " ACCEPTED"
    );

}


/* ================= REJECT ================= */

function rejectApplication(id) {

    const application =
        applications.find(
            app => app.id === id
        );


    if(!application) return;


    application.status =
        "rejected";


    saveApplications();


    loadApplications();


    alert(
        application.nickname +
        " REJECTED"
    );

}


/* ================= SECURITY ================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");

}

</script>

</body>
</html>
